<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d1117">
<meta name="description" content="Scan barcodes and QR codes in a rapid burst with your phone camera. Each read is confirmed and the scanner immediately arms for the next one.">
<title>Scan — Barcode &amp; QR Reader</title>
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="6" y="7" width="2.5" height="18"></rect>
        <rect x="10" y="7" width="1.5" height="18"></rect>
        <rect x="13.5" y="7" width="3" height="18"></rect>
        <rect x="18.5" y="7" width="1.5" height="18"></rect>
        <rect x="22" y="7" width="4" height="18"></rect>
      </svg>
      <span>Scan</span>
    </div>
    <div class="topbar-right">
      <span class="session" id="sessionChip" hidden><b id="sessionCount">0</b> this run</span>
      <span class="engine-badge" id="engineBadge" title="Decoding engine in use">—</span>
    </div>
  </header>

  <main class="stage" id="stage">
    <video id="video" playsinline autoplay muted></video>

    <div class="overlay" aria-hidden="true">
      <div class="frame" id="frame">
        <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
        <div class="scanline"></div>
      </div>
    </div>

    <div class="idle" id="idle">
      <svg viewBox="0 0 24 24" class="idle-icon" aria-hidden="true">
        <path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/>
        <path d="M3.5 12h17"/>
      </svg>
      <p class="idle-title">Ready to scan</p>
      <p class="idle-sub">Tap <strong>Start scanning</strong>, then hold codes up one after another.</p>
    </div>

    <div class="armed" id="armed" hidden>Ready for the next code</div>

    <div class="confirm" id="confirm" hidden>
      <div class="confirm-card" id="confirmCard">
        <div class="confirm-top">
          <span class="tick" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m4 12.5 5.2 5.2L20 7"/></svg>
          </span>
          <span class="format" id="confirmFormat">QR Code</span>
          <span class="confirm-n" id="confirmIndex"></span>
        </div>
        <div class="confirm-value" id="confirmValue"></div>
        <div class="confirm-actions" id="confirmActions" hidden>
          <button type="button" class="btn ghost" id="discardBtn">Discard</button>
          <button type="button" class="btn primary" id="keepBtn">Keep &amp; next</button>
        </div>
      </div>
    </div>

    <div class="flash" id="flash" aria-hidden="true"></div>
  </main>

  <div class="notice" id="notice" role="status" hidden></div>

  <section class="panel">
    <div class="controls">
      <button type="button" class="btn primary" id="startBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span id="startBtnLabel">Start scanning</span>
      </button>
      <button type="button" class="btn icon" id="torchBtn" disabled title="Flashlight" aria-label="Toggle flashlight">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12z"/></svg>
      </button>
      <button type="button" class="btn icon" id="flipBtn" disabled title="Switch camera" aria-label="Switch camera">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 8a8 8 0 0 0-14.3-3M4 16a8 8 0 0 0 14.3 3"/><path d="M4 4v5h5M20 20v-5h-5"/></svg>
      </button>
    </div>

    <div class="modes" role="group" aria-label="Scan mode">
      <button type="button" class="seg is-on" id="modeAuto" data-mode="auto" aria-pressed="true">
        Rapid <small>auto-confirm</small>
      </button>
      <button type="button" class="seg" id="modeConfirm" data-mode="confirm" aria-pressed="false">
        Confirm each <small>tap to keep</small>
      </button>
    </div>

    <div class="history-head">
      <h2>Scans <span class="count" id="historyCount">0</span></h2>
      <div class="head-actions">
        <button type="button" class="linkbtn" id="exportBtn" hidden>Copy all</button>
        <button type="button" class="linkbtn" id="clearBtn" hidden>Clear</button>
      </div>
    </div>
    <ul class="history" id="history"></ul>
    <p class="empty" id="historyEmpty">Every code you scan lands here. Tap a row to copy it.</p>

    <footer class="foot">
      Runs entirely in your browser — nothing is uploaded.
      <a href="https://github.com/aswinsreeram01/barcode-qr-scanner" target="_blank" rel="noopener">Source</a>
    </footer>
  </section>
</div>

<noscript>
  <p style="padding:1.5rem;color:#e6edf3;font:16px/1.5 system-ui">This scanner needs JavaScript to access the camera.</p>
</noscript>

<script src="js/app.js"></script>
</body>
</html>
